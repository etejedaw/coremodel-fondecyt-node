docs: |-
  # Simulacros 2021

  Lee desde MongoDB los simulacros del año 2021 guardados por `POST /emergencia-desastres/simulacros-2021`.

  No consulta la fuente ni modifica datos.

  **Auth:** public

  ## Path params
  - `indicator` (string) — `simulacros-2021`

  ## Response 200
  ```json
  {
    "data": [
      {
        "date": "2021-10-26T00:00:00.000Z",
        "place": "Simulacro de Tsunami",
        "region": "Los Ríos",
        "regionSource": "Los Ríos",
        "indicator": "simulacros-2021",
        "module": "emergencia-desastres",
        "key": "2021-10-26-los-rios",
        "createdAt": "2026-10-18T12:00:00.000Z",
        "updatedAt": "2026-10-18T12:00:00.000Z"
      }
    ]
  }
  ```

  Solo incluye los registros de `simulacros-2021`, aunque la colección `emergencia-desastres` guarda los tres años juntos. `createdAt` y `updatedAt` indican cuándo se guardó cada registro; `_id` y `__v` no se exponen. Si todavía no se ha ejecutado el scraping, responde `{ "data": [] }`.

  ## Errors
  - `404` — `{ "error": "Indicator simulacros-2021 not found" }` si el indicador no existe en el módulo.
  - `502` — `{ "error": "Storage failed: emergencia-desastres find failed" }` si falla la lectura en MongoDB (`StorageError`).
  - `500` — `{ "error": "Internal server error" }` ante un error inesperado.
