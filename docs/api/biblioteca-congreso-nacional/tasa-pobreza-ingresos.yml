info:
  name: Tasa de Pobreza por Ingresos (Valdivia)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/biblioteca-congreso-nacional/valdivia-tasa-pobreza-ingresos"
  params:
    - name: year
      value: "2023"
      type: query

settings:
  encodeUrl: true

docs: |-
  # Tasa de Pobreza por Ingresos (Valdivia)

  Ejecuta el scraping de la tasa de pobreza por ingresos desde BCN para la comuna de Valdivia.

  Requiere el parámetro `year` para indicar el año del reporte comunal.

  Extrae datos de la tabla HTML con tasas CASEN 2017 y CASEN 2022.

  **Auth:** public

  ## Path params
  - `indicator` (string) — `valdivia-tasa-pobreza-ingresos`

  ## Query
  - `year` (string) — año del reporte comunal de la BCN, por ejemplo `2023`. La ruta no lo valida: si falta, consulta la BCN con `anno=undefined` y responde el `400` de `ParseError`.

  ## Response 200
  ```json
  {
    "data": [
      {
        "unidadTerritorial": "Valdivia",
        "casen2017": 12.5,
        "casen2022": 10.3,
        "indicator": "valdivia-tasa-pobreza-ingresos",
        "module": "biblioteca-congreso-nacional",
        "key": "valdivia-biblioteca-congreso-nacional-valdivia-tasa-pobreza-ingresos"
      }
    ]
  }
  ```

  Las tasas vienen en porcentaje y con punto decimal. `key` combina la unidad territorial con el módulo y el indicador, así que una nueva consulta no duplica los registros ya guardados.

  ## Errors
  - `404` — `{ "error": "Indicator valdivia-tasa-pobreza-ingresos not found" }` si el indicador no existe en el módulo.
  - `400` — `{ "error": "Cannot extract data from source" }` si el reporte no contiene la tabla de pobreza, por ejemplo cuando falta `year` o el año no existe (`ParseError`).
  - `400` — `{ "error": "Storage failed: tasa-pobreza-ingresos insertMany failed" }` si falla el guardado en MongoDB (`StorageError`).
  - `500` — `{ "error": "Internal server error" }` si la fuente no responde u ocurre otro error inesperado.
