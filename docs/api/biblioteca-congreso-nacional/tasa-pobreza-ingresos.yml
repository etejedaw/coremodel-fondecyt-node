docs: |-
  # Tasa de Pobreza por Ingresos (Valdivia)

  Lee desde MongoDB la tasa de pobreza por ingresos de Valdivia guardada por `POST /biblioteca-congreso-nacional/valdivia-tasa-pobreza-ingresos`.

  No consulta la fuente ni modifica datos, así que no requiere `year`.

  **Auth:** public

  ## Path params
  - `indicator` (string) — `valdivia-tasa-pobreza-ingresos`

  ## Response 200
  ```json
  {
    "data": [
      {
        "unidadTerritorial": "Valdivia",
        "casen2017": 12.5,
        "casen2022": 10.3,
        "year": "2023",
        "indicator": "valdivia-tasa-pobreza-ingresos",
        "module": "biblioteca-congreso-nacional",
        "key": "valdivia-2023-biblioteca-congreso-nacional-valdivia-tasa-pobreza-ingresos",
        "createdAt": "2026-10-18T12:00:00.000Z",
        "updatedAt": "2026-10-18T12:00:00.000Z"
      }
    ]
  }
  ```

  `createdAt` y `updatedAt` indican cuándo se guardó cada registro; `_id` y `__v` no se exponen. Si todavía no se ha ejecutado el scraping, responde `{ "data": [] }`.

  ## Errors
  - `404` — `{ "error": "Indicator valdivia-tasa-pobreza-ingresos not found" }` si el indicador no existe en el módulo.
  - `502` — `{ "error": "Storage failed: tasa-pobreza-ingresos find failed" }` si falla la lectura en MongoDB (`StorageError`).
  - `500` — `{ "error": "Internal server error" }` ante un error inesperado.
