docs: |-
  # Organizaciones Comunitarias (Valdivia)

  Lee desde MongoDB las organizaciones comunitarias de Valdivia guardadas por `POST /biblioteca-congreso-nacional/valdivia-organizaciones-comunitarias`.

  No consulta la fuente ni modifica datos.

  **Auth:** public

  ## Path params
  - `indicator` (string) — `valdivia-organizaciones-comunitarias`

  ## Response 200
  ```json
  {
    "data": [
      {
        "nDeCentrosDeMadres": 12,
        "nDeOtrasOrganizacionesComunitariasFuncionalesOtros": 45,
        "nDeCentrosDePadresYApoderados": 30,
        "nDeUnionesComunales": 5,
        "nDeJuntasDeVecinos": 98,
        "nCentrosCulturales": 15,
        "nDeOrganizacionesComunitariasSumaTotal": 250,
        "nDeClubesDeportivos": 35,
        "nDeCentrosUOrganizacionesDelAdultoMayor": 8,
        "nDeCompaniasDeBomberos": 2,
        "anio": 2020,
        "indicator": "valdivia-organizaciones-comunitarias",
        "module": "biblioteca-congreso-nacional",
        "key": "1vi5d50",
        "createdAt": "2026-10-18T12:00:00.000Z",
        "updatedAt": "2026-10-18T12:00:00.000Z"
      }
    ]
  }
  ```

  Hay un registro por año guardado. `createdAt` y `updatedAt` indican cuándo se guardó cada registro; `_id` y `__v` no se exponen. Si todavía no se ha ejecutado el scraping, responde `{ "data": [] }`.

  ## Errors
  - `404` — `{ "error": "Indicator valdivia-organizaciones-comunitarias not found" }` si el indicador no existe en el módulo.
  - `502` — `{ "error": "Storage failed: organizaciones-comunitarias find failed" }` si falla la lectura en MongoDB (`StorageError`).
  - `500` — `{ "error": "Internal server error" }` ante un error inesperado.
