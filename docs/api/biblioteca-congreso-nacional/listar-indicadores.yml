http:
  method: GET
  url: "{{baseUrl}}/biblioteca-congreso-nacional"

settings:
  encodeUrl: true

docs: |-
  # Listar indicadores

  Lista todos los indicadores disponibles en el módulo biblioteca-congreso-nacional.

  **Auth:** public

  ## Response 200
  ```json
  {
    "indicators": ["valdivia-tasa-pobreza-ingresos", "valdivia-organizaciones-comunitarias", "valdivia-participacion-electoral"]
  }
  ```

  ## Errors
  - `500` — `{ "error": "Internal server error" }` ante un error inesperado.
